<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920,height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --gold: #d39d27; --ink: #0a0a0a; }
      * { box-sizing: border-box; margin: 0; }
      #root { position: absolute; inset: 0; overflow: hidden; background: var(--ink); color: white; font-family: Inter, Arial, sans-serif; }
      .clip { position: absolute; }
      #hero, #shade { inset: 0; }
      #hero { transform-origin: center; }
      #hero-image { width: 100%; height: 100%; object-fit: cover; }
      #shade { background: linear-gradient(90deg, rgba(0,0,0,.76), rgba(0,0,0,.24) 66%, rgba(0,0,0,.46)); }
      #rule { left: 112px; top: 186px; width: 480px; height: 10px; background: var(--gold); transform-origin: left; }
      #title { left: 112px; top: 254px; width: 980px; font-size: 90px; font-weight: 800; letter-spacing: -.055em; line-height: .94; text-transform: uppercase; }
      #detail { left: 116px; top: 555px; width: 850px; color: var(--gold); font-size: 30px; font-weight: 750; letter-spacing: .13em; line-height: 1.25; text-transform: uppercase; }
      #brand { right: 112px; bottom: 104px; display: flex; align-items: center; gap: 22px; font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
      #brand-mark { width: 72px; height: 72px; border: 2px solid var(--gold); display: grid; place-items: center; color: var(--gold); font-size: 44px; line-height: 1; }
      #micro { left: 116px; bottom: 116px; color: rgba(255,255,255,.78); font-size: 20px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="lecrown-lead-card" data-width="1920" data-height="1080" data-duration="2.4" data-fps="30" data-composition-variables='[{"id":"image","type":"string","label":"Property image","default":""},{"id":"title","type":"string","label":"Title","default":"Featured property"},{"id":"detail","type":"string","label":"Details","default":"LeCrown Properties"},{"id":"micro","type":"string","label":"Supporting line","default":"Houston real estate"}]'>
      <div id="hero" class="clip" data-start="0" data-duration="2.4"><img id="hero-image" data-var-src="image" alt="" /></div>
      <div id="shade" class="clip" data-start="0" data-duration="2.4"></div>
      <div id="rule" class="clip" data-start=".15" data-duration="2.25"></div>
      <h1 id="title" class="clip" data-start=".35" data-duration="2.05" data-var-text="title">Featured property</h1>
      <p id="detail" class="clip" data-start=".68" data-duration="1.72" data-var-text="detail">LeCrown Properties</p>
      <div id="brand" class="clip" data-start="1" data-duration="1.4"><span id="brand-mark">♛</span><span>LeCrown Properties</span></div>
      <p id="micro" class="clip" data-start="1.18" data-duration="1.22" data-var-text="micro">Houston real estate</p>
    </main>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set('#hero', { scale: 1.12 }).to('#hero', { scale: 1.03, duration: 2.4, ease: 'none' }, 0)
        .fromTo('#rule', { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: .35, ease: 'power3.out' }, .15)
        .fromTo('#title', { opacity: 0, x: -70, filter: 'blur(10px)' }, { opacity: 1, x: 0, filter: 'blur(0)', duration: .46, ease: 'power4.out' }, .35)
        .fromTo('#detail', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .35, ease: 'power3.out' }, .68)
        .fromTo('#brand', { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: .4, ease: 'power3.out' }, 1)
        .fromTo('#micro', { opacity: 0 }, { opacity: 1, duration: .3 }, 1.18);
      window.__timelines = window.__timelines || {};
      window.__timelines['lecrown-lead-card'] = tl;
    </script>
  </body>
</html>
