  <script>
      document.fonts.ready.then(() => {
        const duration = Number(document.getElementById('root').dataset.duration);
        const kind = document.getElementById('root').dataset.cardKind;
        const fit = (id, maxHeight, minSize) => {
          const node = document.getElementById(id);
          let size = parseFloat(getComputedStyle(node).fontSize);
          while ((node.scrollHeight > maxHeight || node.scrollWidth > node.clientWidth + 1) && size > minSize) { size -= 1; node.style.fontSize = `${size}px`; }
        };
        fit('headline-text', kind === 'outro' ? 230 : 440, kind === 'outro' ? 46 : 56);
        fit('supporting-text', 250, 32);
        fit('brokerage', 72, 35);
        fit('email', 150, 30);
        const tl = gsap.timeline({ paused: true });
        const arrival = Math.min(.42, duration * .6);
        // Registry lt-mask-reveal inspired accent sweep; copy stays legible at frame zero.
        tl.fromTo('#accent-inner', { scaleX: .18 }, { scaleX: 1, duration: arrival, ease: 'power4.out' }, 0);
        tl.fromTo('#headline-text', { x: 12 }, { x: 0, duration: arrival, ease: 'power4.out' }, 0);
        tl.fromTo('#brand-inner', { opacity: .7 }, { opacity: 1, duration: arrival, ease: 'power2.out' }, 0);
        if (kind === 'outro') tl.fromTo('#contacts-inner', { x: 20, opacity: .8 }, { x: 0, opacity: 1, duration: Math.min(.5, duration * .5), ease: 'power4.out' }, 0);
        tl.to('#accent-inner', { opacity: .45, duration: Math.min(.12, duration * .2) }, Math.max(0, duration - .14));
        window.__timelines = window.__timelines || {};
        window.__timelines['tiktok-highlight-card'] = tl;
      });
    
  </script>
