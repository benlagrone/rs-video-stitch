services:
  render-api:
    build:
      context: .
      dockerfile: render-api/Dockerfile
    image: render-api:latest
    container_name: mediastudio-api
    networks:
      - mediastudio-sextant-net
    environment:
      - RENDER_STORAGE=/videos
      - DB_URL=sqlite:////videos/db.sqlite3
      - INLINE_WORKER=0
      - MEDIASTUDIO_RUNTIME_HOST=fortress.sextant
      - AUTH_TOKEN=${AUTH_TOKEN:?Set AUTH_TOKEN in the Sextant environment}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-http://fortress-sextant.lan:8082}
      - VOICE_GATEWAY_URL=${VOICE_GATEWAY_URL:-http://100.100.97.30:8133}
      - VIBEVOICE_API_URL=${VIBEVOICE_API_URL:-http://100.100.97.30:8011}
      - AZURE_VOICE_API_URL=${AZURE_VOICE_API_URL:-http://100.100.97.30:8013}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://100.100.97.30:11434}
      - STABLE_DIFFUSION_API_URL=${STABLE_DIFFUSION_API_URL:-http://100.100.97.30:7861/sdapi/v1/txt2img}
      - COMFYUI_MODEL_API_URL=${COMFYUI_MODEL_API_URL:-http://100.100.97.30:8188}
      - BIBLE_TEXT_API_URL=${BIBLE_TEXT_API_URL:-https://bible-api.com}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN:-}
      - YOUTUBE_TOKEN_FILE=/videos/youtube_token.json
      - YOUTUBE_MANDARIN_TOKEN_FILE=/videos/youtube_token_mandarin.json
      - YOUTUBE_CLIENT_SECRET_FILE=/videos/youtube_client_secret.json
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI:-http://localhost:8082/v1/youtube/auth/callback}
      - YOUTUBE_LOOPBACK_BRIDGE=${YOUTUBE_LOOPBACK_BRIDGE:-true}
      - DEFAULT_FPS=30
      - DEFAULT_MIN_SHOT=2.5
      - DEFAULT_MAX_SHOT=8.0
      - DEFAULT_XFADE=0.5
      - DEFAULT_CRF=18
      - DEFAULT_PRESET=medium
    volumes:
      - ${MEDIASTUDIO_RENDER_STORAGE:-/Users/benjaminlagrone/Videos/MediaStudio}:/videos
    ports:
      - "8082:8080"
    restart: unless-stopped

  render-worker:
    image: render-api:latest
    container_name: mediastudio-worker
    entrypoint: ["/usr/bin/tini","--"]
    command: ["python","-m","app.worker"]
    networks:
      - mediastudio-sextant-net
    environment:
      - RENDER_STORAGE=/videos
      - DB_URL=sqlite:////videos/db.sqlite3
      - MEDIASTUDIO_RUNTIME_HOST=fortress.sextant
      - AUTH_TOKEN=${AUTH_TOKEN:?Set AUTH_TOKEN in the Sextant environment}
      - VOICE_GATEWAY_URL=${VOICE_GATEWAY_URL:-http://100.100.97.30:8133}
      - VIBEVOICE_API_URL=${VIBEVOICE_API_URL:-http://100.100.97.30:8011}
      - AZURE_VOICE_API_URL=${AZURE_VOICE_API_URL:-http://100.100.97.30:8013}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://100.100.97.30:11434}
      - STABLE_DIFFUSION_API_URL=${STABLE_DIFFUSION_API_URL:-http://100.100.97.30:7861/sdapi/v1/txt2img}
      - COMFYUI_MODEL_API_URL=${COMFYUI_MODEL_API_URL:-http://100.100.97.30:8188}
      - BIBLE_TEXT_API_URL=${BIBLE_TEXT_API_URL:-https://bible-api.com}
    volumes:
      - ${MEDIASTUDIO_RENDER_STORAGE:-/Users/benjaminlagrone/Videos/MediaStudio}:/videos
    depends_on:
      - render-api
    restart: unless-stopped

networks:
  mediastudio-sextant-net:
    name: mediastudio-sextant-net
