name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  render-api:
    name: Render API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/render-api
        run: python -m unittest discover -s tests

  render-ui:
    name: Render UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

  docker-image:
    name: Docker Image
    runs-on: ubuntu-latest
    needs:
      - render-api
      - render-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build render image
        run: docker build -f render-api/Dockerfile -t rs-video-stitch-render-api:ci .
